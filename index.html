<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Pokémon Mezzastar Countdown</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100dvh;
      background: radial-gradient(ellipse at top, #1a0533 0%, #0d0d1a 60%, #000 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      padding:
        max(20px, env(safe-area-inset-top))
        max(16px, env(safe-area-inset-right))
        max(24px, env(safe-area-inset-bottom))
        max(16px, env(safe-area-inset-left));
      overflow-y: auto;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(1px 1px at 12% 18%, #fff 0%, transparent 100%),
        radial-gradient(1px 1px at 33% 62%, #ffd700 0%, transparent 100%),
        radial-gradient(1px 1px at 54% 9%,  #fff 0%, transparent 100%),
        radial-gradient(1px 1px at 73% 43%, #fff 0%, transparent 100%),
        radial-gradient(1px 1px at 88% 78%, #ffd700 0%, transparent 100%),
        radial-gradient(1px 1px at 8%  83%, #fff 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 58% 72%, #fff 0%, transparent 100%),
        radial-gradient(1px 1px at 22% 33%, #ffd700 0%, transparent 100%),
        radial-gradient(1px 1px at 80% 11%, #fff 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 46% 88%, #fff 0%, transparent 100%),
        radial-gradient(1px 1px at 67% 27%, #ffd700 0%, transparent 100%),
        radial-gradient(1px 1px at 5%  50%, #fff 0%, transparent 100%);
      pointer-events: none;
      z-index: 0;
    }

    .wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ── Header ── */
    .header { text-align: center; margin-bottom: 14px; }
    .today-label {
      font-size: 0.62rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #a78bfa;
      margin-bottom: 3px;
    }
    .today-date { font-size: 0.88rem; color: #e2e8f0; font-weight: 500; }

    /* ── Pokéball ── */
    .pokeball-deco {
      width: 46px; height: 46px;
      border-radius: 50%;
      background: linear-gradient(to bottom, #e53e3e 50%, #fff 50%);
      border: 3px solid #2d3748;
      position: relative;
      margin: 0 auto 11px;
      animation: pokeglow 2.5s ease-in-out infinite;
      flex-shrink: 0;
    }
    .pokeball-deco::before {
      content: '';
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%,-50%);
      width: 11px; height: 11px;
      background: #fff;
      border-radius: 50%;
      border: 3px solid #2d3748;
      z-index: 2;
    }
    .pokeball-deco::after {
      content: '';
      position: absolute;
      top: calc(50% - 1.5px);
      left: 0; right: 0; height: 3px;
      background: #2d3748;
    }
    @keyframes pokeglow {
      0%,100% { box-shadow: 0 0 18px rgba(229,62,62,0.5), 0 0 36px rgba(229,62,62,0.2); }
      50%     { box-shadow: 0 0 28px rgba(229,62,62,0.9), 0 0 56px rgba(229,62,62,0.4); }
    }

    /* ── Title ── */
    .title {
      font-size: clamp(1.25rem, 5vw, 1.55rem);
      font-weight: 900;
      text-align: center;
      line-height: 1.2;
      letter-spacing: -0.3px;
      background: linear-gradient(135deg, #ffd700 0%, #ff6b35 50%, #ffd700 100%);
      background-size: 200%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shimmer 3s linear infinite;
      margin-bottom: 18px;
    }
    @keyframes shimmer {
      0%   { background-position: 0% 50%; }
      100% { background-position: 200% 50%; }
    }

    /* ── KPI Card ── */
    .kpi-card {
      width: 100%;
      background: linear-gradient(145deg, rgba(255,255,255,0.08), rgba(255,255,255,0.03));
      border: 1px solid rgba(255,215,0,0.25);
      border-radius: 24px;
      padding: 24px 24px 18px;
      text-align: center;
      position: relative;
      overflow: hidden;
      margin-bottom: 12px;
      backdrop-filter: blur(12px);
      box-shadow: 0 20px 50px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
    }
    .kpi-card::before {
      content: '★';
      position: absolute;
      top: -16px; right: -8px;
      font-size: 100px;
      opacity: 0.03;
      color: #ffd700;
      pointer-events: none;
    }
    .kpi-sublabel {
      font-size: 0.62rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #a0aec0;
      margin-bottom: 6px;
    }
    .kpi-number {
      font-size: clamp(5rem, 18vw, 7rem);
      font-weight: 900;
      line-height: 1;
      letter-spacing: -4px;
      background: linear-gradient(135deg, #ffd700 0%, #ffa500 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .kpi-number.bump { animation: bump 0.25s ease; }
    @keyframes bump {
      0%   { transform: scale(1); }
      50%  { transform: scale(1.08); }
      100% { transform: scale(1); }
    }
    .kpi-unit {
      font-size: 0.82rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #718096;
      margin-top: 2px;
      margin-bottom: 10px;
    }
    .kpi-until {
      font-size: 0.72rem;
      color: #718096;
      border-top: 1px solid rgba(255,255,255,0.06);
      padding-top: 10px;
    }
    .kpi-until span { color: #a0aec0; }
    .badge-expired {
      display: inline-block;
      background: linear-gradient(135deg, #e53e3e, #c53030);
      color: #fff;
      font-size: 0.58rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 2px 7px;
      border-radius: 99px;
      margin-left: 6px;
      vertical-align: middle;
    }

    /* ── Buttons ── */
    .btn-row {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }
    .btn {
      padding: 15px;
      font-size: 0.9rem;
      font-weight: 700;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      transition: transform 0.15s ease, filter 0.15s ease;
      position: relative;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      min-height: 52px;
    }
    .btn::after {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(to bottom, rgba(255,255,255,0.15), transparent);
      pointer-events: none;
    }
    .btn:hover  { transform: translateY(-2px); filter: brightness(1.1); }
    .btn:active { transform: scale(0.96);      filter: brightness(0.92); }
    .btn-add   { background: linear-gradient(135deg, #48bb78, #276749); color: #fff; box-shadow: 0 6px 20px rgba(72,187,120,0.35); }
    .btn-minus { background: linear-gradient(135deg, #fc8181, #9b2c2c); color: #fff; box-shadow: 0 6px 20px rgba(252,129,129,0.35); }
    .btn-reset { background: linear-gradient(135deg, #667eea, #4c51bf); color: #fff; box-shadow: 0 6px 20px rgba(102,126,234,0.35); font-size: 0.8rem; }

    /* ── Tally windows ── */
    .btn-group { display: flex; flex-direction: column; align-items: center; gap: 7px; }
    .tally {
      width: 100%;
      text-align: center;
      padding: 5px 10px;
      border-radius: 10px;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 1px;
      backdrop-filter: blur(6px);
    }
    .tally-add   { background: rgba(72,187,120,0.12); border: 1px solid rgba(72,187,120,0.25); color: #68d391; }
    .tally-minus { background: rgba(252,129,129,0.12); border: 1px solid rgba(252,129,129,0.25); color: #fc8181; }

    /* ── Pokémon Characters ── */
    .pokemon-row {
      width: 100%;
      display: flex;
      align-items: flex-end;
      justify-content: space-around;
      margin-bottom: 12px;
      padding: 0 4px;
    }
    .pokemon-figure {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }
    .pokemon-wrap {
      position: relative;
      width: 96px;
      height: 116px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      overflow: visible;
    }
    .pokemon-wrap svg {
      width: 88px;
      height: auto;
      transform-origin: bottom center;
      overflow: visible;
    }
    .pokemon-name {
      font-size: 0.58rem;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: #718096;
    }

    /* ── Pikachu dance ── */
    .pikachu-svg { animation: pikachu-dance 0.72s ease-in-out infinite; }
    @keyframes pikachu-dance {
      0%   { transform: translateY(0px)   rotate(-4deg) scaleX(1);    }
      18%  { transform: translateY(-13px) rotate(5deg)  scaleX(1);    }
      36%  { transform: translateY(-5px)  rotate(-3deg) scaleX(1.04); }
      54%  { transform: translateY(-15px) rotate(6deg)  scaleX(1);    }
      72%  { transform: translateY(-7px)  rotate(-2deg) scaleX(1.04); }
      100% { transform: translateY(0px)   rotate(-4deg) scaleX(1);    }
    }

    /* ── Squirtle dance (offset rhythm) ── */
    .squirtle-svg { animation: squirtle-dance 0.96s ease-in-out infinite; }
    @keyframes squirtle-dance {
      0%   { transform: translateY(0px)   rotate(5deg); }
      22%  { transform: translateY(-12px) rotate(-6deg); }
      44%  { transform: translateY(-4px)  rotate(4deg); }
      66%  { transform: translateY(-10px) rotate(-5deg); }
      88%  { transform: translateY(-2px)  rotate(3deg); }
      100% { transform: translateY(0px)   rotate(5deg); }
    }

    /* Sparks (Pikachu) */
    .spark {
      position: absolute;
      font-size: 11px;
      animation: spark-flash 0.72s ease-in-out infinite;
      pointer-events: none;
      line-height: 1;
    }
    .spark:nth-child(1) { top: 12px; left:  4px; animation-delay: 0s;    }
    .spark:nth-child(2) { top:  6px; right: 5px; animation-delay: 0.24s; }
    .spark:nth-child(3) { top: 32px; left:  1px; animation-delay: 0.48s; }
    @keyframes spark-flash {
      0%,100% { opacity: 0; transform: scale(0.3) rotate(0deg);  }
      40%,60% { opacity: 1; transform: scale(1)   rotate(20deg); }
    }

    /* Water drops (Squirtle) */
    .drop {
      position: absolute;
      font-size: 10px;
      animation: drop-rise 0.96s ease-out infinite;
      pointer-events: none;
      line-height: 1;
    }
    .drop:nth-child(1) { bottom: 28px; left:  4px; animation-delay: 0s;    }
    .drop:nth-child(2) { bottom: 18px; right: 6px; animation-delay: 0.36s; }
    .drop:nth-child(3) { bottom: 38px; right: 1px; animation-delay: 0.72s; }
    @keyframes drop-rise {
      0%   { opacity: 0; transform: translateY(0px)   scale(0.5); }
      25%  { opacity: 1; transform: translateY(-10px) scale(1);   }
      100% { opacity: 0; transform: translateY(-26px) scale(0.4); }
    }

    /* ── URL hint ── */
    .url-hint {
      width: 100%;
      text-align: center;
      font-size: 0.63rem;
      color: #4a5568;
      line-height: 1.6;
    }
    .url-hint a { color: #a78bfa; text-decoration: none; cursor: pointer; }
    .url-hint a:hover { text-decoration: underline; }
    .copied-toast { display: none; margin-top: 3px; font-size: 0.6rem; color: #68d391; }

    /* ── iPhone SE / compact height ── */
    @media (max-height: 680px) {
      .pokeball-deco { width: 36px; height: 36px; margin-bottom: 8px; }
      .title         { font-size: 1.15rem; margin-bottom: 12px; }
      .kpi-card      { padding: 18px 18px 14px; margin-bottom: 10px; }
      .kpi-number    { font-size: 4.5rem; }
      .pokemon-wrap  { height: 90px; }
      .pokemon-wrap svg { width: 70px; }
      .btn           { padding: 12px; min-height: 46px; }
      .header        { margin-bottom: 10px; }
      .btn-row       { margin-bottom: 10px; }
      .pokemon-row   { margin-bottom: 8px; }
    }
  </style>
</head>
<body>
<div class="wrapper">

  <div class="header">
    <div class="today-label">Today</div>
    <div class="today-date" id="today-date">—</div>
  </div>

  <div class="pokeball-deco"></div>
  <h1 class="title">Pokémon<br>Mezzastar Countdown</h1>

  <div class="kpi-card">
    <div class="kpi-sublabel">Days Remaining</div>
    <div class="kpi-number" id="kpi-number">—</div>
    <div class="kpi-unit">Days</div>
    <div class="kpi-until" id="kpi-until"></div>
  </div>

  <div class="btn-row">
    <div class="btn-group">
      <button class="btn btn-add" onclick="adjust(+1)">＋ Add Day</button>
      <div class="tally tally-add" id="tally-add">＋0 days</div>
    </div>
    <div class="btn-group">
      <button class="btn btn-minus" onclick="adjust(-1)">－ Minus Day</button>
      <div class="tally tally-minus" id="tally-minus">－0 days</div>
    </div>
  </div>
  <div class="btn-row" style="grid-template-columns: 1fr; margin-bottom: 14px; margin-top: -4px;">
    <button class="btn btn-reset" onclick="reset()">↺ Reset to 7 Days</button>
  </div>

  <!-- ── Dancing Pokémon ── -->
  <div class="pokemon-row">

    <!-- Pikachu -->
    <div class="pokemon-figure">
      <div class="pokemon-wrap">
        <span class="spark">⚡</span>
        <span class="spark">✦</span>
        <span class="spark">⚡</span>
        <svg class="pikachu-svg" viewBox="0 0 100 126" xmlns="http://www.w3.org/2000/svg">
          <!-- Lightning bolt tail -->
          <polygon points="74,80 87,62 79,56 85,39 71,52 77,68 66,76" fill="#C8A000"/>
          <!-- Body -->
          <ellipse cx="49" cy="104" rx="27" ry="19" fill="#FFE135"/>
          <!-- Back stripes -->
          <ellipse cx="37" cy="97" rx="5" ry="9" fill="#B08C00" opacity="0.45" transform="rotate(-18,37,97)"/>
          <ellipse cx="61" cy="97" rx="5" ry="9" fill="#B08C00" opacity="0.45" transform="rotate(18,61,97)"/>
          <!-- Left arm raised -->
          <ellipse cx="22" cy="89" rx="7" ry="13" fill="#FFE135" transform="rotate(32,22,89)"/>
          <!-- Right arm raised -->
          <ellipse cx="76" cy="89" rx="7" ry="13" fill="#FFE135" transform="rotate(-32,76,89)"/>
          <!-- Left foot -->
          <ellipse cx="36" cy="121" rx="12" ry="5" fill="#FFE135"/>
          <!-- Right foot -->
          <ellipse cx="62" cy="121" rx="12" ry="5" fill="#FFE135"/>
          <!-- Head -->
          <circle cx="49" cy="50" r="27" fill="#FFE135"/>
          <!-- Left ear -->
          <polygon points="25,34 15,5 40,26" fill="#FFE135"/>
          <polygon points="25,33 17,7 33,24" fill="#1A1A1A"/>
          <!-- Right ear -->
          <polygon points="73,34 83,5 58,26" fill="#FFE135"/>
          <polygon points="73,33 81,7 65,24" fill="#1A1A1A"/>
          <!-- Eyes -->
          <circle cx="36" cy="47" r="7.5" fill="#1A1A1A"/>
          <circle cx="62" cy="47" r="7.5" fill="#1A1A1A"/>
          <!-- Eye shine -->
          <circle cx="38.5" cy="44.5" r="2.8" fill="white"/>
          <circle cx="64.5" cy="44.5" r="2.8" fill="white"/>
          <!-- Red cheeks -->
          <circle cx="23" cy="57" r="8.5" fill="#FF3333" opacity="0.82"/>
          <circle cx="75" cy="57" r="8.5" fill="#FF3333" opacity="0.82"/>
          <!-- Nose -->
          <ellipse cx="49" cy="55" rx="2.5" ry="2" fill="#2a2a2a"/>
          <!-- Smile -->
          <path d="M40,61 Q49,71 58,61" stroke="#2a2a2a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="pokemon-name">Pikachu</div>
    </div>

    <!-- Squirtle -->
    <div class="pokemon-figure">
      <div class="pokemon-wrap">
        <span class="drop">💧</span>
        <span class="drop">💧</span>
        <span class="drop">💧</span>
        <svg class="squirtle-svg" viewBox="0 0 100 126" xmlns="http://www.w3.org/2000/svg">
          <!-- Shell (behind) -->
          <ellipse cx="50" cy="96" rx="26" ry="23" fill="#5A7A35"/>
          <ellipse cx="50" cy="96" rx="20" ry="17" fill="#7CAD4A"/>
          <line x1="50" y1="79" x2="50" y2="113" stroke="#5A7A35" stroke-width="1.5"/>
          <line x1="33" y1="88" x2="67" y2="104" stroke="#5A7A35" stroke-width="1.5"/>
          <line x1="33" y1="104" x2="67" y2="88"  stroke="#5A7A35" stroke-width="1.5"/>
          <ellipse cx="50" cy="96" rx="26" ry="23" fill="none" stroke="#4A6925" stroke-width="1.8"/>
          <!-- Curly tail -->
          <path d="M67,112 Q83,107 85,93 Q87,80 77,76" stroke="#5BAADC" stroke-width="6" fill="none" stroke-linecap="round"/>
          <!-- Body -->
          <ellipse cx="50" cy="99" rx="24" ry="20" fill="#5BAADC"/>
          <!-- Belly -->
          <ellipse cx="50" cy="101" rx="15" ry="14" fill="#E8D098"/>
          <!-- Left arm -->
          <ellipse cx="28" cy="97" rx="7" ry="11" fill="#5BAADC" transform="rotate(22,28,97)"/>
          <!-- Right arm -->
          <ellipse cx="72" cy="97" rx="7" ry="11" fill="#5BAADC" transform="rotate(-22,72,97)"/>
          <!-- Left foot -->
          <ellipse cx="36" cy="118" rx="11" ry="6" fill="#5BAADC"/>
          <!-- Right foot -->
          <ellipse cx="64" cy="118" rx="11" ry="6" fill="#5BAADC"/>
          <!-- Head -->
          <circle cx="50" cy="50" r="27" fill="#5BAADC"/>
          <!-- Ear bumps -->
          <circle cx="29" cy="31" r="9.5" fill="#5BAADC"/>
          <circle cx="71" cy="31" r="9.5" fill="#5BAADC"/>
          <!-- Big cute eyes (whites) -->
          <circle cx="36" cy="47" r="10.5" fill="white"/>
          <circle cx="64" cy="47" r="10.5" fill="white"/>
          <!-- Pupils -->
          <circle cx="37" cy="48" r="6.5"  fill="#1A1A1A"/>
          <circle cx="65" cy="48" r="6.5"  fill="#1A1A1A"/>
          <!-- Eye shine -->
          <circle cx="39.5" cy="45.5" r="2.5" fill="white"/>
          <circle cx="67.5" cy="45.5" r="2.5" fill="white"/>
          <!-- Nose -->
          <ellipse cx="50" cy="57" rx="3" ry="2.5" fill="#3A7AAC"/>
          <!-- Smile -->
          <path d="M41,63 Q50,72 59,63" stroke="#3A7AAC" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="pokemon-name">Squirtle</div>
    </div>

  </div>
  <!-- end pokemon-row -->

  <div class="url-hint">
    State saved in URL — <a onclick="copyURL()">copy link</a> to bookmark or share.
    <div class="copied-toast" id="copied-toast">✓ Copied!</div>
  </div>

</div>
<script>
  const DEFAULT_DAYS = 7;
  let daysAdded  = parseInt(localStorage.getItem('daysAdded')  || '0');
  let daysMinus  = parseInt(localStorage.getItem('daysMinus')  || '0');

  function updateTallies() {
    document.getElementById('tally-add').textContent   = `＋${daysAdded} day${daysAdded  !== 1 ? 's' : ''}`;
    document.getElementById('tally-minus').textContent = `－${daysMinus} day${daysMinus !== 1 ? 's' : ''}`;
  }

  function todayISO() {
    const d = new Date();
    return iso(d.getFullYear(), d.getMonth()+1, d.getDate());
  }
  function iso(y,m,d) {
    return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  }
  function parseISO(s) {
    const [y,m,d] = s.split('-').map(Number);
    return new Date(y, m-1, d);
  }
  function shiftISO(s, n) {
    const d = parseISO(s);
    d.setDate(d.getDate()+n);
    return iso(d.getFullYear(), d.getMonth()+1, d.getDate());
  }
  function daysLeft(endISO) {
    return Math.round((parseISO(endISO) - parseISO(todayISO())) / 86400000);
  }
  function formatFull(s) {
    return parseISO(s).toLocaleDateString('en-US', {
      weekday:'long', year:'numeric', month:'long', day:'numeric'
    });
  }

  function getHash() {
    const m = window.location.hash.match(/end=(\d{4}-\d{2}-\d{2})/);
    return m ? m[1] : null;
  }
  function setHash(endDate) {
    history.replaceState(null, '', `#end=${endDate}`);
  }
  function getOrInitEnd() {
    let end = getHash();
    if (!end) { end = shiftISO(todayISO(), DEFAULT_DAYS); setHash(end); }
    return end;
  }

  function render() {
    const end  = getOrInitEnd();
    const left = daysLeft(end);
    document.getElementById('today-date').textContent = formatFull(todayISO());
    document.getElementById('kpi-number').textContent = left;
    const badge = left < 0   ? '<span class="badge-expired">Expired</span>'
                : left === 0 ? '<span class="badge-expired">Today!</span>' : '';
    document.getElementById('kpi-until').innerHTML =
      `Until <span>${formatFull(end)}</span>${badge}`;
  }

  function reset() {
    daysAdded = 0; daysMinus = 0;
    localStorage.setItem('daysAdded', '0');
    localStorage.setItem('daysMinus', '0');
    setHash(shiftISO(todayISO(), DEFAULT_DAYS));
    const el = document.getElementById('kpi-number');
    el.classList.remove('bump');
    void el.offsetWidth;
    el.classList.add('bump');
    render();
    updateTallies();
  }

  function adjust(delta) {
    if (delta > 0) { daysAdded += delta; localStorage.setItem('daysAdded', daysAdded); }
    else           { daysMinus -= delta; localStorage.setItem('daysMinus', daysMinus); }
    setHash(shiftISO(getOrInitEnd(), delta));
    const el = document.getElementById('kpi-number');
    el.classList.remove('bump');
    void el.offsetWidth;
    el.classList.add('bump');
    render();
    updateTallies();
  }

  function copyURL() {
    navigator.clipboard.writeText(window.location.href).then(() => {
      const t = document.getElementById('copied-toast');
      t.style.display = 'block';
      setTimeout(() => t.style.display = 'none', 2000);
    });
  }

  render();
  updateTallies();
  window.addEventListener('hashchange', render);
</script>
</body>
</html>
